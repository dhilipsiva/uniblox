[package]
name = "standalone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The uniblox Mode-1 runtime: the shared simulation with local authority and no networking stack"

# Mode 1 (Standalone) runtime, ADR-0030. Deliberately NET-FREE: depends only on
# engine-core (+ protocol) and the bevy app/time/ecs crates — NO transport,
# replication, matchbox, or str0m. That absence is the "runs with the networking
# stack absent" acceptance, provable at the crate-graph level (and guarded by a
# cargo-tree check in scripts/git-hooks/pre-commit).
[dependencies]
protocol = { path = "../protocol", version = "0.1.0" }
engine-core = { path = "../engine-core", version = "0.1.0" }
# Content scripts (ADR-0045); net-free like everything else here.
scripting = { path = "../scripting", version = "0.1.0" }
bevy_app.workspace = true
bevy_time.workspace = true
bevy_ecs.workspace = true
