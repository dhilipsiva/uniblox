[package]
name = "scripting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A locked-down Rhai engine for uniblox game logic; built and sandbox-tested, but not yet used by the simulation"

[dependencies]
rhai.workspace = true
bevy_ecs.workspace = true
log.workspace = true

[dev-dependencies]
# integration tests (tests/) are separate crates — they need rhai/bevy_ecs directly. `metadata` (tests
# only; resolver 3 keeps dev-dependency features out of normal builds) lets the API-lock test enumerate
# the whitelist.
rhai = { workspace = true, features = ["metadata"] }
bevy_ecs.workspace = true
tempfile.workspace = true
filetime.workspace = true
