[package]
name = "services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The uniblox signaling service: mode- and version-scoped WebRTC signaling, session grouping and a shared Redis session registry"

[dependencies]
matchbox_signaling.workspace = true
matchbox_protocol.workspace = true         # PeerId + JsonPeer{Request,Event} wire types
axum = { workspace = true, features = ["ws"] }  # reasoned gate rejections (ADR-0038) + ws::Message for the relay (ADR-0039)
async-trait.workspace = true               # the custom NextTopology SignalingTopology impl (ADR-0039)
futures.workspace = true                   # StreamExt on the WsStateMeta receiver (relay loop, ADR-0039)
redis.workspace = true                     # the shared Redis session-registry backend (ADR-0040)
uuid.workspace = true                      # per-node id for the shared registry (ADR-0040)
tracing.workspace = true                   # best-effort store-mirror failure logs (ADR-0040)
tokio = { workspace = true, features = ["time"] }  # bounded timeout on the store mirror (ADR-0040)
tracing-subscriber.workspace = true
hmac.workspace = true                      # join tokens (ADR-0047)
sha2.workspace = true
serde_json.workspace = true                # the token endpoint's response (ADR-0047)

[dev-dependencies]
# raw-WS signaling integration tests (ADR-0037/0038/0039): connect peers, assert
# relay + scope isolation + the asymmetric filter + ?next=N session grouping + the
# session registry. `time`/`net` extend the workspace tokio features (macros/rt)
# for `timeout`/`sleep` + the WS client.
tokio = { workspace = true, features = ["time", "net", "macros", "rt-multi-thread"] }
tokio-tungstenite.workspace = true
serde_json.workspace = true
