[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The uniblox Mode-3 runtime: the headless authoritative server that runs the shared simulation"

[dependencies]
protocol = { path = "../protocol", version = "0.1.0" }
engine-core = { path = "../engine-core", version = "0.1.0" }
# Content scripts (ADR-0045).
scripting = { path = "../scripting", version = "0.1.0" }
replication = { path = "../replication", version = "0.1.0" }
transport = { path = "../transport", version = "0.1.0" }
bevy_app.workspace = true
bevy_time.workspace = true
bevy_ecs.workspace = true
futures.workspace = true
log.workspace = true

# The per-process event-signing key (ADR-0049). Native only: the browser draws its key from
# crypto.getRandomValues, and getrandom needs an explicit backend on wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom.workspace = true

[dev-dependencies]
# scripted_modes.rs runs Mode 1 on the real standalone app (ADR-0045).
standalone = { path = "../standalone", version = "0.1.0" }
# headless-app tests embed an in-process signaling server + a raw test client
matchbox_signaling.workspace = true
tokio = { workspace = true, features = ["time"] }
